# Nginx reverse proxy cho goclaw.daugiatem.com -> GoClaw (container 127.0.0.1:18790)
#
# daugiatem.com (apex) được giữ lại riêng cho dự án web đấu giá tem — GoClaw
# chạy hẳn trên subdomain này, không dùng chung apex.
#
# Cài đặt trên VPS:
#   sudo cp deploy/nginx-goclaw-daugiatem.conf /etc/nginx/sites-available/goclaw.daugiatem.com
#   sudo ln -s /etc/nginx/sites-available/goclaw.daugiatem.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sau khi DNS goclaw.daugiatem.com trỏ đúng VPS, chạy:
#   sudo certbot --nginx -d goclaw.daugiatem.com
# Certbot sẽ tự thêm block 443/ssl_certificate vào file này.

server {
    listen 80;
    listen [::]:80;
    server_name goclaw.daugiatem.com;

    client_max_body_size 50m;

    access_log /var/log/nginx/goclaw.daugiatem.com.access.log;
    error_log  /var/log/nginx/goclaw.daugiatem.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;

        # Cần cho WebSocket RPC của gateway (docs/19-websocket-rpc.md)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent chạy tác vụ dài — tránh Nginx cắt kết nối giữa chừng
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
