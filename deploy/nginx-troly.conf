# Nginx reverse proxy cho troly.pro.vn -> GoClaw (container 127.0.0.1:18790)
#
# Cài đặt trên VPS:
#   sudo cp deploy/nginx-troly.conf /etc/nginx/sites-available/troly.pro.vn
#   sudo ln -s /etc/nginx/sites-available/troly.pro.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Yêu cầu trước đó:
#   - Cloudflare SSL/TLS mode = Full (strict)
#   - Cloudflare Origin Certificate đã tạo và lưu tại:
#       /etc/nginx/ssl/troly.pro.vn.pem
#       /etc/nginx/ssl/troly.pro.vn.key

# Dải IP của Cloudflare — để Nginx log/nhận đúng IP thật của visitor
# thay vì IP edge của Cloudflare. Danh sách cập nhật tại:
# https://www.cloudflare.com/ips-v4  /  https://www.cloudflare.com/ips-v6
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name troly.pro.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name troly.pro.vn;

    ssl_certificate     /etc/nginx/ssl/troly.pro.vn.pem;
    ssl_certificate_key /etc/nginx/ssl/troly.pro.vn.key;

    client_max_body_size 50m;

    access_log /var/log/nginx/troly.pro.vn.access.log;
    error_log  /var/log/nginx/troly.pro.vn.error.log;

    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;

        # Cần cho WebSocket RPC của gateway (docs/19-websocket-rpc.md)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Agent chạy tác vụ dài — tránh Nginx cắt kết nối giữa chừng
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
