# Production override cho daugiatem.com.
# Dùng cùng với docker-compose.yml + docker-compose.postgres.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.prod.yml up -d
#
# Mục đích:
#   - Dùng image build từ CI của repo này thay vì image upstream mặc định.
#   - goclaw (18790) và postgres (5432) publish ra 0.0.0.0 (không giới hạn
#     127.0.0.1 — Docker Engine trên VPS này gặp lỗi nội bộ khi publish port
#     giới hạn vào 127.0.0.1 cụ thể: "address already in use" dù cổng thực
#     sự trống, xác nhận bằng bind test thuần ngoài Docker). An toàn vì
#     UFW trên VPS mặc định deny toàn bộ incoming, chỉ allow 22/80/443 —
#     18790/5432 không lọt ra ngoài dù publish 0.0.0.0. Public traffic luôn
#     đi qua Nginx (443) như bình thường.

services:
  goclaw:
    image: ${GOCLAW_IMAGE:-ghcr.io/bbgiangpp-cpu/goclaw-daugiatem:latest}
    ports:
      - "0.0.0.0:18790:18790"
    restart: always
    # VPS có 2 vCPU / ~1.9GB RAM, dùng chung với Postgres trên cùng máy —
    # chừa lại tài nguyên cho hệ điều hành + Postgres.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
          pids: 200

  postgres:
    restart: always
    # Ảnh mặc định dùng max_connections=100/shared_buffers=128MB (Postgres
    # default) — dư thừa cho 1 tenant/1 agent dùng nhẹ, đo thực tế tốn tới
    # ~248MB RAM cho 14 connection (đa số idle) trên VPS chỉ có 1.9GB.
    # Giảm xuống mức đủ dùng cho use case cá nhân, còn dư headroom cho vài
    # subagent/tool chạy song song.
    command: postgres -c max_connections=30 -c shared_buffers=64MB
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100
